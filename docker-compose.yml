services:
  gfs-retention:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gfs-retention:latest
    restart: unless-stopped
    environment:
      # S3 connection (secrets should be provided via a .env file or the host).
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKETS: ${S3_BUCKETS:?set S3_BUCKETS}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Retention and scheduling.
      RETENTION: ${RETENTION:-14,8,12,3}
      TZ: ${TZ:-UTC}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 4 * * *}
      # Deletions stay disabled unless explicitly enabled.
      APPLY: ${APPLY:-}
